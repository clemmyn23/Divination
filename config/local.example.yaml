# Copy this to config/local.yaml and make it yours. It is merged over
# config/defaults.yaml, which lists every setting. config/local.yaml is not committed.

me:
  name: Sam
  email: sam@example.com

sources: [calendar, github, slack]

github:
  host: github.example.com
  rotationTeam: frontend-crew
  crewMembers:
    - ana   # crew captain
    - kit
  slackSignal:
    channelId: C00000003

slack:
  transport: inbox   # fed by /slack-sweep; "api" needs a Slack app and a token
  workspaceUrl: https://example.slack.com
  teamId: T00000000
  userId: U00000000
  muteAuthors:
    - Google Calendar
  groups:
    - name: Team
      kind: digest
      conversations:
        - { id: C00000001, name: team-dev }
        - { id: U00000001, name: Ana, dm: true }
    - name: Alerts
      kind: alerts
      conversations:
        - { id: C00000002, name: svc-alerts }

calendar:
  transport: inbox   # fed by /calendar-read; "ics" needs the calendar's secret address
