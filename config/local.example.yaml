# Copy this to config/local.yaml and make it yours. It is merged over
# config/defaults.yaml, which lists every setting. config/local.yaml is not committed.

me:
  name: Sam
  email: sam@example.com

sources: [calendar, github, slack]

# Let Refresh now run the calendar read and the Slack sweep through Claude (on Haiku).
# Pressing again within throttleMinutes refreshes as usual without asking Claude again.
claudeReads:
  onRefresh: true
  throttleMinutes: 2

github:
  host: github.example.com
  # Optional: only if you are in a review crew. Delete this block if you are not.
  crew:
    rotationTeam: frontend-crew   # the crew's GitHub team
    members:                      # GitHub usernames
      - ana   # crew captain
      - kit
    reviewChannel:
      channelId: C00000003        # where the crew's reviews are asked for
  # Optional: a Fix button on your own PRs that are failing CI or have merge conflicts.
  # Name your local clone of each repository you want it for.
  # fix:
  #   clones:
  #     "acme/monolith": /Users/you/code/monolith

slack:
  transport: inbox   # fed by /slack-sweep; "api" needs a Slack app and a token
  workspaceUrl: https://example.slack.com
  teamId: T00000000
  userId: U00000000
  muteAuthors:
    - Google Calendar
  groups:
    - name: Team
      kind: digest
      conversations:
        - { id: C00000001, name: team-dev }
        - { id: U00000001, name: Ana, dm: true }
    - name: Alerts
      kind: alerts
      conversations:
        - { id: C00000002, name: svc-alerts }

calendar:
  transport: inbox   # fed by /calendar-read; "ics" needs the calendar's secret address
